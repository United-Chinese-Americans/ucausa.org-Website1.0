<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>United Chinese Americans</title>
    <link rel="icon" href="https://storage.googleapis.com/objects.ucausa.org/logo/logo.png" type="image/png">
    <link rel="stylesheet" href="styles/shared.css">
    <link rel="stylesheet" href="styles/contact.css">
    <script defer src="scripts/shared.js"></script>
    <script defer src="scripts/contact.js"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Great+Vibes&display=swap"
        rel="stylesheet">
</head>

<body>

    <!-- Header will be loaded here -->
    <div id="header-placeholder"></div>
    <main>
        <section class="contact-hero">
            <div class="hero-overlay"></div>
            <div class="hero-content">
                <h1>Contact Us</h1>
            </div>
        </section>
        <section class="feedback-section">
            <div class="feedback-container">
                <h2>Feedback</h2>
                <form id="feedback-form">
                    <div class="form-group">
                        <label for="name">Name</label>
                        <input type="text" id="name" name="name" required>
                    </div>
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                    <div class="form-group">
                        <label for="message">Message</label>
                        <textarea id="message" name="message" rows="5" required></textarea>
                    </div>
                    <button type="submit" class="submit-btn">Submit</button>
                    <div id="form-status"></div>
                </form>
            </div>
        </section>
        <section class="map-contact-section">
            <div class="map-wrapper">
                <iframe src="https://maps.google.com/maps?q=1050%20Connecticut%20Ave.%20NW,%20Suite%20500,%20Washington,%20DC%2020036&t=&z=15&ie=UTF8&iwloc=&output=embed" width="100%" height="450" style="border:0;" allowfullscreen="" loading="lazy"></iframe>
            </div>
            <div class="contact-info">
                <h3>United Chinese Americans</h3>
                <p>1050 Connecticut Ave. NW, Suite 500</p>
                <p>Washington, DC 20036</p>
                <br>
                <p>For any inquiries, please contact <a href="mailto:info@ucausa.org">info@ucausa.org</a>.</p>
                <br>
                <p>UCA</p>
            </div>
        </section>
    </main>
    <!-- Footer will be loaded here -->
    <div id="footer-placeholder"></div>

</body>

</html
