<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>United Chinese Americans</title>
    <link rel="icon" href="https://storage.googleapis.com/objects.ucausa.org/logo/logo.png" type="image/png">
    <link rel="stylesheet" href="styles/shared.css">
    <link rel="stylesheet" href="styles/team.css">
    <script defer src="scripts/shared.js"></script>
    <script defer src="scripts/team.js"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Great+Vibes&display=swap"
        rel="stylesheet">
</head>

<body>

    <!-- Header will be loaded here -->
    <div id="header-placeholder"></div>
    <main>
        <section class="team-hero">
            <div class="hero-overlay"></div>
            <div class="hero-content">
                <h1>OUR TEAM</h1>
            </div>
        </section>

        <section class="board-section">
            <div class="board-container">
                <h2>Board of Directors</h2>
                <div id="board-grid" class="board-grid"></div>
                <div class="board-toggle-container">
                    <button id="toggle-board-btn" class="board-btn">Show More</button>
                </div>
            </div>
        </section>

        <section class="executive-section">
            <div class="board-container">
                <h2>Executive Team</h2>
                <div id="executive-grid" class="board-grid"></div>
                <div class="board-toggle-container">
                    <button id="toggle-executive-btn" class="board-btn">Show More</button>
                </div>
            </div>
        </section>
    </main>
    <!-- Footer will be loaded here -->
    <div id="footer-placeholder"></div>

</body>

</html>
